
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Qualify.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #FCFBF9;
      color: #142657;
    }

    header {
      background: white;
      border-bottom: 1px solid #DCE3F0;
      padding: 18px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { width: 180px; }

    header a {
      color: #516383;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    main {
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border: 1px solid #DCE3F0;
      border-radius: 24px;
      padding: 55px 45px;
      max-width: 710px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 50px rgba(20,38,87,0.05);
    }

    .check {
      margin: 0 auto 25px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #F0FAF3;
      color: #299457;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
    }

    .eyebrow {
      color: #7088CE;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: -2px;
      margin: 15px 0 20px;
    }

    h1 span { color: #7088CE; }

    p {
      font-size: 16px;
      color: #516383;
      line-height: 1.8;
      max-width: 500px;
      margin: 0 auto 30px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 22px;
      border-radius: 10px;
      background: #FF9128;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .btn.secondary {
      background: white;
      border: 1px solid #DCE3F0;
      color: #142657;
    }

    @media (max-width: 600px) {
      .card { padding: 35px 22px; }
      .buttons { flex-direction: column; }
      .logo { width: 150px; }
    }
  </style>
</head>

<body>
  <header>
    <a href="https://opsiblex.github.io/qualify-io/">
      <img class="logo"
        src="https://43713505.fs1.hubspotusercontent-na1.net/hubfs/43713505/qualifyio/qualify-logo.png"
        alt="Qualify.io">
    </a>
    <a href="https://opsiblex.github.io/qualify-io/">
      Back to website
    </a>
  </header>

  <main>
    <section class="card">
      <div class="check">&#10003;</div>

      <div class="eyebrow">
        Recruitment Efficiency Checklist
      </div>

      <h1>
        Thank you for
        <span>completing the checklist!</span>
      </h1>

      <p>
        We appreciate your interest in a more efficient,
        skills-focused recruitment process. Explore how
        Qualify.io helps teams look beyond the CV.
      </p>

      <div class="buttons">
        <a class="btn"
          href="https://opsiblex.github.io/qualify-io/solutions.html">
          Explore Our Solutions
        </a>

        <a class="btn secondary"
          href="https://opsiblex.github.io/qualify-io/">
          Back to Homepage
        </a>
      </div>
    </section>
  </main>
</body>
</html>
